name: EnterpriseERP Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - platform-refactor

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enterpriseerp
          POSTGRES_PASSWORD: enterpriseerp
          POSTGRES_DB: enterpriseerp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterpriseerp -d enterpriseerp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://enterpriseerp:enterpriseerp@localhost:5432/enterpriseerp_ci?schema=public
      JWT_SECRET: enterpriseerp-ci-secret-change-in-production
      JWT_EXPIRATION: 15m
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      EMAIL_VERIFICATION_REQUIRED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: services/api

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install mobile dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Dependency audit
        run: |
          npm audit --audit-level=moderate
          npm --prefix services/api audit --audit-level=moderate
          npm --prefix apps/web audit --audit-level=moderate
          npm --prefix apps/mobile audit --audit-level=moderate

      - name: Build and static QA
        run: npm run qa

      - name: Prepare CI database
        run: |
          npm --prefix services/api run prisma:deploy
          npm --prefix services/api run prisma:seed

      - name: Security checks
        run: npm run qa:security

      - name: Start API
        run: |
          npm --prefix services/api run build
          npm --prefix services/api run start > /tmp/enterpriseerp-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:4000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/enterpriseerp-api.log
          exit 1

      - name: API E2E smoke
        run: npm run e2e:api
